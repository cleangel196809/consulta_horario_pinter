<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Horarios PINTER · Ingreso</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <img src="/img/logo-pinter.png" alt="Politécnico Internacional" class="logo-login">
      <h1>Consulta de Horarios</h1>
      <p class="subt">Politécnico Internacional</p>
      <div id="msgError" class="mensaje-error"></div>
      <form id="formLogin">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autofocus>
        <br><br>
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
        <br><br>
        <button type="submit" class="primario">Ingresar</button>
      </form>
      <p style="text-align:center;margin-top:10px;">
        <a href="/olvide-password.html" style="font-size:0.85rem;color:#555;">¿Olvidaste tu contraseña?</a>
      </p>

      <div id="cajaCambioPassword" class="oculto">
        <p style="font-size:0.85rem;color:#555;text-align:center;margin-bottom:14px;">
          Es tu primer ingreso (o un administrador reinició tu clave). Debes definir una
          nueva contraseña antes de continuar.
        </p>
        <div id="msgCambioPassword" class="mensaje-error"></div>
        <form id="formCambioPassword">
          <label for="passwordActualCambio">Contraseña actual</label>
          <input type="password" id="passwordActualCambio" required>
          <br><br>
          <label for="passwordNueva">Nueva contraseña</label>
          <input type="password" id="passwordNueva" minlength="4" required>
          <br><br>
          <label for="passwordNuevaConfirmar">Confirmar nueva contraseña</label>
          <input type="password" id="passwordNuevaConfirmar" minlength="4" required>
          <br><br>
          <button type="submit" class="primario">Cambiar contraseña y continuar</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let tokenTemporal = null;

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msgError");
      msg.style.display = "none";

      try {
        const body = new URLSearchParams();
        body.append("username", username);
        body.append("password", password);

        const resp = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || "Usuario o contraseña incorrectos");
        }
        const data = await resp.json();
        localStorage.setItem("ph_token", data.access_token);
        localStorage.setItem("ph_rol", data.rol);
        localStorage.setItem("ph_nombre", data.nombre_completo || data.username);
        localStorage.setItem("ph_username", data.username);

        if (data.debe_cambiar_password === true) {
          tokenTemporal = data.access_token;
          document.getElementById("passwordActualCambio").value = password;
          document.getElementById("formLogin").classList.add("oculto");
          document.getElementById("cajaCambioPassword").classList.remove("oculto");
          return;
        }
        window.location.href = "/consulta.html";
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = "block";
      }
    });

    document.getElementById("formCambioPassword").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msgCambioPassword");
      msg.style.display = "none";

      const passwordActual = document.getElementById("passwordActualCambio").value;
      const passwordNueva = document.getElementById("passwordNueva").value;
      const passwordConfirmar = document.getElementById("passwordNuevaConfirmar").value;

      if (passwordNueva.length < 4) {
        msg.textContent = "La nueva contraseña debe tener al menos 4 caracteres.";
        msg.style.display = "block";
        return;
      }
      if (passwordNueva !== passwordConfirmar) {
        msg.textContent = "Las contraseñas nuevas no coinciden.";
        msg.style.display = "block";
        return;
      }

      try {
        const resp = await fetch("/api/auth/cambiar-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${tokenTemporal}`,
          },
          body: JSON.stringify({ password_actual: passwordActual, password_nueva: passwordNueva }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.detail || "No se pudo cambiar la contraseña");
        }
        window.location.href = "/consulta.html";
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = "block";
      }
    });
  </script>
</body>
</html>
