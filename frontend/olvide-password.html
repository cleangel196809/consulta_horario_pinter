<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Horarios PINTER · Recuperar contraseña</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <img src="/img/logo-pinter.png" alt="Politécnico Internacional" class="logo-login">
      <h1>Recuperar contraseña</h1>
      <p class="subt">Politécnico Internacional</p>

      <div id="msg" class="mensaje-error" style="display:none;"></div>
      <div id="msgOk" class="mensaje-error" style="display:none;background:#e6f4ea;color:#1e7a34;"></div>

      <form id="formOlvide">
        <p style="font-size:0.85rem;color:#555;">
          Escribe tu usuario (tu correo institucional @pi.edu.co). Si tiene una
          cuenta activa, te enviaremos un enlace para definir una nueva
          contraseña.
        </p>
        <label for="username">Usuario / correo</label>
        <input type="text" id="username" required autofocus>
        <br><br>
        <button type="submit" class="primario">Enviar enlace de recuperación</button>
      </form>

      <p style="text-align:center;margin-top:14px;">
        <a href="/index.html" style="font-size:0.85rem;color:#555;">Volver al inicio de sesión</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById("formOlvide").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const msg = document.getElementById("msg");
      const msgOk = document.getElementById("msgOk");
      msg.style.display = "none";
      msgOk.style.display = "none";

      try {
        const resp = await fetch("/api/auth/olvide-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.detail || "No se pudo procesar la solicitud.");
        }
        msgOk.textContent = data.detail || "Si el usuario existe, se envió un enlace de recuperación.";
        msgOk.style.display = "block";
        document.getElementById("formOlvide").reset();
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = "block";
      }
    });
  </script>
</body>
</html>
