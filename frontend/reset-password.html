<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Horarios PINTER · Nueva contraseña</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <img src="/img/logo-pinter.png" alt="Politécnico Internacional" class="logo-login">
      <h1>Definir nueva contraseña</h1>
      <p class="subt">Politécnico Internacional</p>

      <div id="msg" class="mensaje-error" style="display:none;"></div>
      <div id="msgOk" class="mensaje-error" style="display:none;background:#e6f4ea;color:#1e7a34;"></div>

      <form id="formReset">
        <label for="passwordNueva">Nueva contraseña</label>
        <input type="password" id="passwordNueva" minlength="4" required>
        <br><br>
        <label for="passwordConfirmar">Confirmar nueva contraseña</label>
        <input type="password" id="passwordConfirmar" minlength="4" required>
        <br><br>
        <button type="submit" class="primario">Guardar nueva contraseña</button>
      </form>

      <p style="text-align:center;margin-top:14px;">
        <a href="/index.html" style="font-size:0.85rem;color:#555;">Volver al inicio de sesión</a>
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const msg = document.getElementById("msg");
    const msgOk = document.getElementById("msgOk");

    if (!token) {
      msg.textContent = "Falta el token de recuperación en el enlace. Solicita uno nuevo desde 'Olvidé mi contraseña'.";
      msg.style.display = "block";
      document.getElementById("formReset").style.display = "none";
    }

    document.getElementById("formReset").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.style.display = "none";
      msgOk.style.display = "none";

      const passwordNueva = document.getElementById("passwordNueva").value;
      const passwordConfirmar = document.getElementById("passwordConfirmar").value;

      if (passwordNueva.length < 4) {
        msg.textContent = "La nueva contraseña debe tener al menos 4 caracteres.";
        msg.style.display = "block";
        return;
      }
      if (passwordNueva !== passwordConfirmar) {
        msg.textContent = "Las contraseñas no coinciden.";
        msg.style.display = "block";
        return;
      }

      try {
        const resp = await fetch("/api/auth/restablecer-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password_nueva: passwordNueva }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          throw new Error(data.detail || "No se pudo restablecer la contraseña.");
        }
        msgOk.textContent = data.detail || "Contraseña actualizada. Ya puedes iniciar sesión.";
        msgOk.style.display = "block";
        document.getElementById("formReset").style.display = "none";
        setTimeout(() => { window.location.href = "/index.html"; }, 2500);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.display = "block";
      }
    });
  </script>
</body>
</html>
