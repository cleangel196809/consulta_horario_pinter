<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Horarios PINTER</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="marca">
      <img src="/img/logo-pinter.png" alt="Politécnico Internacional" class="logo-topbar">
      <h1>Consulta de Horarios</h1>
    </div>
    <div class="usuario-info">
      <span id="nombreUsuario"></span>
      <span class="badge-rol" id="badgeRol"></span>
      <button class="secundario" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>

  <nav class="tabs">
    <button class="activo" onclick="location.href='/consulta.html'">Consultar horario</button>
    <button onclick="location.href='/docentes.html'">Docentes</button>
    <button onclick="location.href='/estudiantes.html'">Estudiantes</button>
    <button onclick="location.href='/dashboard.html'">Reportes</button>
    <button id="tabAdmin" class="oculto" onclick="location.href='/admin.html'">Panel administrador</button>
  </nav>

  <main>
    <div class="card">
      <h2>Filtrar horario</h2>
      <div class="filtros-grid">
        <div>
          <label for="fPeriodo">Período</label>
          <select id="fPeriodo"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="fDia">Día</label>
          <select id="fDia"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="fSede">Sede</label>
          <select id="fSede"><option value="">Todas</option></select>
        </div>
        <div>
          <label for="fSalon">Salón</label>
          <select id="fSalon"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="fMateria">Materia</label>
          <input type="text" id="fMateria" placeholder="Ej: Algoritmos">
        </div>
        <div>
          <label for="fGrupo">Grupo de formación</label>
          <select id="fGrupo"><option value="">Todos</option></select>
        </div>
        <div>
          <label for="fDocente">Docente (nombre)</label>
          <input type="text" id="fDocente" placeholder="Ej: Martha Bello">
        </div>
      </div>

      <p class="link-avanzado" onclick="toggleAvanzado()">
        <span id="toggleAvanzadoTexto">▸ Búsqueda avanzada (facultad, programa, jornada)</span>
      </p>
      <div class="filtros-grid oculto" id="filtrosAvanzados">
        <div>
          <label for="fFacultad">Facultad</label>
          <input type="text" id="fFacultad" list="listaFacultades" placeholder="Ej: SALUD">
          <datalist id="listaFacultades"></datalist>
        </div>
        <div>
          <label for="fPrograma">Programa</label>
          <input type="text" id="fPrograma" list="listaProgramas" placeholder="Ej: GASTRONOMIA">
          <datalist id="listaProgramas"></datalist>
        </div>
        <div>
          <label for="fJornada">Jornada</label>
          <input type="text" id="fJornada" list="listaJornadas" placeholder="Ej: NOCHE">
          <datalist id="listaJornadas"></datalist>
        </div>
      </div>
      <button class="primario" onclick="buscar()" style="max-width:220px;">Buscar</button>
    </div>

    <div class="card">
      <h2>Resultados <span id="conteo" class="pill"></span></h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Día</th><th>Hora</th><th>Sede</th><th>Salón</th>
              <th>Materia</th><th>Grupo</th><th>Docente</th><th>Programa</th><th>Estado</th><th>Clase virtual</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="nota">Consulta de Horarios PINTER · datos cargados por el administrador en cada ciclo</footer>

  <script src="/js/api.js"></script>
  <script src="/js/consulta.js"></script>
</body>
</html>
